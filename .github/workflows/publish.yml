name: Publish CPMCD Dotvanta

on:
  push:
    tags:
      - 'v*.*.*'

  workflow_dispatch:
    inputs:
      version:
        description: 'Package version, e.g. 1.0.0'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and Publish NuGet Packages
    runs-on: windows-latest

    steps:
      # ============================================
      # 1. Checkout
      # ============================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================
      # 2. Setup .NET 9
      # ============================================
      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # ============================================
      # 3. Install MAUI workload
      # ============================================
      - name: Install MAUI workload
        shell: pwsh
        run: |
          dotnet workload install maui

      # ============================================
      # 4. Determine package version
      # ============================================
      - name: Determine package version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
              $version = "${{ inputs.version }}"
          }
          else {
              $version = "${env:GITHUB_REF_NAME}" -replace '^v', ''
          }

          Write-Host "Package version: $version"

          if ($version -notmatch '^\d+\.\d+\.\d+([\-+][0-9A-Za-z.-]+)?$') {
              Write-Error "Invalid package version: $version"
              exit 1
          }

          "VERSION=$version" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append

      # ============================================
      # 5. Verify project files
      # ============================================
      - name: Verify project files
        shell: pwsh
        run: |
          $projects = @(
              "./CPMCD.Dotvanta.ApiCaller/CPMCD.Dotvanta.ApiCaller.csproj",
              "./CPMCD.Dotvanta.Component/CPMCD.Dotvanta.Component.csproj",
              "./CPMCD.Dotvanta.Mail/CPMCD.Dotvanta.Mail.csproj"
          )

          foreach ($project in $projects) {
              if (-not (Test-Path $project)) {
                  Write-Error "Project not found: $project"
                  exit 1
              }

              Write-Host "Found: $project"
          }

          Write-Host "All project files found."

      # ============================================
      # 6. Restore
      # ============================================
      - name: Restore ApiCaller
        shell: pwsh
        run: |
          dotnet restore ./CPMCD.Dotvanta.ApiCaller/CPMCD.Dotvanta.ApiCaller.csproj

      - name: Restore Component
        shell: pwsh
        run: |
          dotnet restore ./CPMCD.Dotvanta.Component/CPMCD.Dotvanta.Component.csproj

      - name: Restore Mail
        shell: pwsh
        run: |
          dotnet restore ./CPMCD.Dotvanta.Mail/CPMCD.Dotvanta.Mail.csproj

      # ============================================
      # 7. Build
      # ============================================
      - name: Build ApiCaller
        shell: pwsh
        run: |
          dotnet build ./CPMCD.Dotvanta.ApiCaller/CPMCD.Dotvanta.ApiCaller.csproj `
            --configuration Release `
            --no-restore

      - name: Build Component
        shell: pwsh
        run: |
          dotnet build ./CPMCD.Dotvanta.Component/CPMCD.Dotvanta.Component.csproj `
            --configuration Release `
            --no-restore

      - name: Build Mail
        shell: pwsh
        run: |
          dotnet build ./CPMCD.Dotvanta.Mail/CPMCD.Dotvanta.Mail.csproj `
            --configuration Release `
            --no-restore

      # ============================================
      # 8. Create artifacts directory
      # ============================================
      - name: Create artifacts directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "./artifacts"

      # ============================================
      # 9. Pack
      # ============================================
      - name: Pack ApiCaller
        shell: pwsh
        run: |
          dotnet pack ./CPMCD.Dotvanta.ApiCaller/CPMCD.Dotvanta.ApiCaller.csproj `
            --configuration Release `
            --no-build `
            --output ./artifacts `
            -p:PackageVersion=$env:VERSION

      - name: Pack Component
        shell: pwsh
        run: |
          dotnet pack ./CPMCD.Dotvanta.Component/CPMCD.Dotvanta.Component.csproj `
            --configuration Release `
            --no-build `
            --output ./artifacts `
            -p:PackageVersion=$env:VERSION

      - name: Pack Mail
        shell: pwsh
        run: |
          dotnet pack ./CPMCD.Dotvanta.Mail/CPMCD.Dotvanta.Mail.csproj `
            --configuration Release `
            --no-build `
            --output ./artifacts `
            -p:PackageVersion=$env:VERSION

      # ============================================
      # 10. Verify packages
      # ============================================
      - name: Verify NuGet packages
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "Generated packages:"
          Get-ChildItem "./artifacts" -Filter "*.nupkg" |
            ForEach-Object {
              Write-Host " - $($_.Name)"
            }

          $expected = @(
              "CPMCD.Dotvanta.ApiCaller.$env:VERSION.nupkg",
              "CPMCD.Dotvanta.Component.$env:VERSION.nupkg",
              "CPMCD.Dotvanta.Mail.$env:VERSION.nupkg"
          )

          foreach ($name in $expected) {
              if (-not (Test-Path "./artifacts/$name")) {
                  Write-Error "Package was not generated: $name"
                  exit 1
              }
          }

          Write-Host "All packages generated successfully."

      # ============================================
      # 11. NuGet Trusted Publishing / OIDC
      #
      # IMPORTANT:
      # nuget.org must have a Trusted Publishing policy:
      #
      # Repository Owner : FaisalRazaKhan
      # Repository       : CPMCD.Dotvanta
      # Workflow File    : publish.yml
      # Environment      : empty
      # Policy Owner     : the NuGet owner of the packages
      # ============================================
      - name: NuGet Trusted Publishing Login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: frazakhan

      # ============================================
      # 12. Publish ApiCaller
      # ============================================
      - name: Publish ApiCaller
        shell: pwsh
        run: |
          $package = Get-ChildItem "./artifacts" `
            -Filter "CPMCD.Dotvanta.ApiCaller.$env:VERSION.nupkg" |
            Select-Object -First 1

          if (-not $package) {
              Write-Error "ApiCaller package not found."
              exit 1
          }

          Write-Host "Publishing: $($package.Name)"

          dotnet nuget push $package.FullName `
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" `
            --source "https://api.nuget.org/v3/index.json" `
            --skip-duplicate

      # ============================================
      # 13. Publish Component
      # ============================================
      - name: Publish Component
        shell: pwsh
        run: |
          $package = Get-ChildItem "./artifacts" `
            -Filter "CPMCD.Dotvanta.Component.$env:VERSION.nupkg" |
            Select-Object -First 1

          if (-not $package) {
              Write-Error "Component package not found."
              exit 1
          }

          Write-Host "Publishing: $($package.Name)"

          dotnet nuget push $package.FullName `
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" `
            --source "https://api.nuget.org/v3/index.json" `
            --skip-duplicate

      # ============================================
      # 14. Publish Mail
      # ============================================
      - name: Publish Mail
        shell: pwsh
        run: |
          $package = Get-ChildItem "./artifacts" `
            -Filter "CPMCD.Dotvanta.Mail.$env:VERSION.nupkg" |
            Select-Object -First 1

          if (-not $package) {
              Write-Error "Mail package not found."
              exit 1
          }

          Write-Host "Publishing: $($package.Name)"

          dotnet nuget push $package.FullName `
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" `
            --source "https://api.nuget.org/v3/index.json" `
            --skip-duplicate

      # ============================================
      # 15. Upload packages
      # ============================================
      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: CPMCD.Dotvanta-NuGet-${{ env.VERSION }}
          path: ./artifacts/*.nupkg

      # ============================================
      # 16. Completed
      # ============================================
      - name: Publish completed
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host " NuGet Publishing Completed Successfully "
          Write-Host "=========================================="
          Write-Host "Project : CPMCD.Dotvanta"
          Write-Host "Version : $env:VERSION"
          Write-Host ""
          Write-Host "Published:"
          Write-Host " - CPMCD.Dotvanta.ApiCaller"
          Write-Host " - CPMCD.Dotvanta.Component"
          Write-Host " - CPMCD.Dotvanta.Mail"
          Write-Host "=========================================="
